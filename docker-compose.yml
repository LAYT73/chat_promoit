version: '3'
services:
  nestjs-server:
    build: ./server # Path to your NestJS Dockerfile
    container_name: nestjs_server
    ports:
      - "3000:3000"  # Expose NestJS app on port 3000
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nestdb
    depends_on:
      - db

  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nestdb
    ports:
      - "5432:5432"  # Expose PostgreSQL on port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vite-app:
    build: ./client  # Path to your React Vite Dockerfile
    container_name: vite_app
    ports:
      - "4173:4173"  # Expose React Vite app on port 5173
    environment:
      - VITE_API_BASE_URL=http://localhost:3000 # Environment variable pointing to the NestJS API

volumes:
  postgres_data:
